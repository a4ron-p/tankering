<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Appearance Tracker</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-heading: #ffffff;
      --accent-color: #2ea043;
      --accent-hover: #3fb950;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      color: var(--text-heading);
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 1.25rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      min-width: 200px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent-color);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.25rem;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #21262d;
      color: var(--text-heading);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge {
      background-color: rgba(46, 160, 67, 0.15);
      color: var(--accent-color);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
    }

    .empty-state {
      padding: 2rem;
      text-align: center;
      color: #8b949e;
    }
  </style>
</head>
<body>

    <h1>Driver Appearance Tracker</h1>
    <p class="subtitle">Monthly driver schedule summary (January - October)</p>

    <div class="controls">
      <div class="control-group">
        <label for="monthFilter">Select Month</label>

          <option value="ALL">All Months (Jan - Oct)</option>
          <option value="January">January</option>
          <option value="February">February</option>
          <option value="March">March</option>
          <option value="April">April</option>
          <option value="May">May</option>
          <option value="June">June</option>
          <option value="July">July</option>
          <option value="August">August</option>
          <option value="September">September</option>
          <option value="October">October</option>
        </select>
      </div>

      <div class="control-group">
        <label for="driverFilter">Filter by Driver</label>
        <select id="driverFilter">
          <option value="ALL">All Drivers</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="value" id="totalAppearances">0</div>
        <div class="label" id="appearancesLabel">Total Driver Appearances</div>
      </div>
      <div class="stat-card">
        <div class="value" id="activeDrivers">0</div>
        <div class="label">Unique Drivers Listed</div>

    </div>

    <div class="table-container">
      <table>

        <tbody id="tableBody">

      <div id="emptyMessage" class="empty-state" style="display: none;">

  </div>

    // Populate Driver Filter Dropdown
    function populateDriverDropdown() {
      const driverSelect = document.getElementById("driverFilter");
      const uniqueDrivers = [...new Set(rawData.map(item => item.driver))].sort();
      
      uniqueDrivers.forEach(driver => {
        const option = document.createElement("option");
        option.value = driver;
        option.textContent = driver;
        driverSelect.appendChild(option);
      });
    }

    // Render Table and Summary Stats
    function render() {
      const monthFilter = document.getElementById("monthFilter").value;
      const driverFilter = document.getElementById("driverFilter").value;
      const tableBody = document.getElementById("tableBody");
      const emptyMessage = document.getElementById("emptyMessage");

      // Filter logic
      let filtered = rawData.filter(item => {
        const matchMonth = (monthFilter === "ALL") || (item.month === monthFilter);
        const matchDriver = (driverFilter === "ALL") || (item.driver === driverFilter);
        return matchMonth && matchDriver;
      });

      // If viewing ALL months with ALL drivers (or filtering by driver across months), 
      // aggregate totals per driver or keep per month depending on month selection
      let displayData = [];

      if (monthFilter === "ALL" && driverFilter === "ALL") {
        // Aggregate totals across all months
        const totalsMap = {};
        filtered.forEach(item => {
          totalsMap[item.driver] = (totalsMap[item.driver] || 0) + item.count;
        });
        
        displayData = Object.keys(totalsMap).map(driver => ({
          driver: driver,
          month: "Jan - Oct Total",
          count: totalsMap[driver]
        })).sort((a, b) => b.count - a.count);

      } else if (monthFilter === "ALL" && driverFilter !== "ALL") {
        // Show row per month for specific driver
        displayData = filtered.map(item => ({
          driver: item.driver,
          month: item.month,
          count: item.count
        }));
      } else {
        // Specific month view
        displayData = filtered.sort((a, b) => b.count - a.count);
      }

      // Update UI elements
      tableBody.innerHTML = "";
      
      if (displayData.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
        displayData.forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${item.driver}</strong></td>
            <td>${item.month}</td>
            <td><span class="badge">${item.count}</span></td>
          `;
          tableBody.appendChild(tr);
        });
      }

      // Update Cards
      const grandTotal = filtered.reduce((sum, item) => sum + item.count, 0);
      const uniqueDriversCount = new Set(filtered.map(i => i.driver)).size;

      document.getElementById("totalAppearances").textContent = grandTotal;
      document.getElementById("activeDrivers").textContent = uniqueDriversCount;
      document.getElementById("appearancesLabel").textContent = 
        monthFilter === "ALL" ? "Total Appearances (Jan-Oct)" : `Appearances in ${monthFilter}`;
    }

    // Attach Event Listeners
    document.getElementById("monthFilter").addEventListener("change", render);
    document.getElementById("driverFilter").addEventListener("change", render);

    // Initial Execution
    populateDriverDropdown();
    render();
  </script>

</html>
