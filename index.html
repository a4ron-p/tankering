<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver & Helper Schedule Tracker</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0a0a0a;
      --border-color: #222222;
      --border-hover: #444444;
      --text-main: #ffffff;
      --text-muted: #888888;
      --pill-bg: #111111;
      --driver-color: #ffffff;
      --helper-color: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
      width: 100%;
    }

    select:focus, select:hover {
      border-color: var(--border-hover);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1.25rem 1rem;
      text-align: center;
    }

    .stat-card .value {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #050505;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #111111;
    }

    .person-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      border: 1px solid var(--border-color);
      background: var(--pill-bg);
      margin-right: 0.35rem;
      margin-bottom: 0.2rem;
    }

    .driver-badge {
      color: var(--driver-color);
      border-color: #444444;
    }

    .helper-badge {
      color: var(--helper-color);
    }

    .role-tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .tag-driver {
      background: #ffffff;
      color: #000000;
    }

    .tag-helper {
      border: 1px solid #444444;
      color: #aaaaaa;
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

    <header>
      <h1>Driver & Helper Schedule Tracker</h1>
      <p class="subtitle">January – October Schedule Analysis (1st Person = Driver, Subsequent = Helpers)</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="monthFilter">Month Filter</label>
        <select id="monthFilter">
          <option value="ALL">All Months (Jan – Oct)</option>
          <option value="January">January</option>
          <option value="February">February</option>
          <option value="March">March</option>
          <option value="April">April</option>
          <option value="May">May</option>
          <option value="June">June</option>
          <option value="July">July</option>
          <option value="August">August</option>
          <option value="September">September</option>
          <option value="October">October</option>
        </select>
      </div>

      <div class="control-group">
        <label for="personFilter">Person Filter</label>
        <select id="personFilter">
          <option value="ALL">All Personnel</option>
        </select>
      </div>

      <div class="control-group">
        <label for="roleFilter">Role Filter</label>
        <select id="roleFilter">
          <option value="ALL">Both Roles</option>
          <option value="Driver">Driver Only</option>
          <option value="Helper">Helper Only</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="value" id="statRows">0</div>
        <div class="label">Total Trips / Rows</div>
      </div>
      <div class="stat-card">
        <div class="value" id="statDrivers">0</div>
        <div class="label">Driver Duty Count</div>
      </div>
      <div class="stat-card">
        <div class="value" id="statHelpers">0</div>
        <div class="label">Helper Duty Count</div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr id="tableHeader">
            <th>Month</th>
            <th>Driver (1st Listed)</th>
            <th>Helper(s)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated dynamically via JS -->
        </tbody>
      </table>
      <div id="emptyMessage" class="empty-state" style="display: none;">
        No records found for the selected filters.
      </div>
    </div>
  </div>

    function populatePersonDropdown() {
      const personSelect = document.getElementById("personFilter");
      const personSet = new Set();

      logs.forEach(row => {
        if (row.driver) personSet.add(row.driver);
        row.helpers.forEach(h => personSet.add(h));
      });

      Array.from(personSet).sort().forEach(person => {
        const opt = document.createElement("option");
        opt.value = person;
        opt.textContent = person;
        personSelect.appendChild(opt);
      });
    }

    function render() {
      const selectedMonth = document.getElementById("monthFilter").value;
      const selectedPerson = document.getElementById("personFilter").value;
      const selectedRole = document.getElementById("roleFilter").value;

      const tableBody = document.getElementById("tableBody");
      const emptyMessage = document.getElementById("emptyMessage");

      let filteredLogs = logs.filter(row => {
        // Month Filter
        if (selectedMonth !== "ALL" && row.month !== selectedMonth) return false;

        // Person & Role Filters
        if (selectedPerson !== "ALL") {
          const isDriver = row.driver === selectedPerson;
          const isHelper = row.helpers.includes(selectedPerson);

          if (selectedRole === "Driver" && !isDriver) return false;
          if (selectedRole === "Helper" && !isHelper) return false;
          if (selectedRole === "ALL" && !isDriver && !isHelper) return false;
        } else {
          if (selectedRole === "Driver" && !row.driver) return false;
          if (selectedRole === "Helper" && row.helpers.length === 0) return false;
        }

        return true;
      });

      // Update Table Content
      tableBody.innerHTML = "";

      if (filteredLogs.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
        filteredLogs.forEach(row => {
          const tr = document.createElement("tr");

          const helpersHTML = row.helpers.length > 0 
            ? row.helpers.map(h => `<span class="person-badge helper-badge">${h}</span>`).join("")
            : `<span style="color: #444444;">—</span>`;

          tr.innerHTML = `
            <td><strong>${row.month}</strong></td>
            <td><span class="person-badge driver-badge">${row.driver}</span></td>
            <td>${helpersHTML}</td>
          `;
          tableBody.appendChild(tr);
        });
      }

      // Calculate Stats
      let driverCount = 0;
      let helperCount = 0;

      filteredLogs.forEach(row => {
        if (selectedPerson === "ALL") {
          if (row.driver) driverCount++;
          helperCount += row.helpers.length;
        } else {
          if (row.driver === selectedPerson) driverCount++;
          if (row.helpers.includes(selectedPerson)) helperCount++;
        }
      });

      document.getElementById("statRows").textContent = filteredLogs.length;
      document.getElementById("statDrivers").textContent = driverCount;
      document.getElementById("statHelpers").textContent = helperCount;
    }

    document.getElementById("monthFilter").addEventListener("change", render);
    document.getElementById("personFilter").addEventListener("change", render);
    document.getElementById("roleFilter").addEventListener("change", render);

    populatePersonDropdown();
    render();
  </script>

</html>
